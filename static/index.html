<!DOCTYPE html>
<html>
<head>
<title>JSPobeda</title>
<style>
html { color-scheme: light dark; }
body { width: 35em; margin: 0 auto;
font-family: Tahoma, Verdana, Arial, sans-serif; }
.p {
    font-size: 24pt;
    flex: 1;
}
.container {
    display: flex;
    height: 100%;
    width: 100%;
    flex-direction: column;
    justify-items: center;
    align-items: center;
    gap: 10px;
}
img {
    flex: 1;
}
.text {
    flex: 1;
    font-size: 32pt;
    font-weight: 600;
}
</style>
</head>
<body>

<div class="container">
    <div class="text">Hello world</div>
    <p>Feed</p>
    <img src="/img/feed.svg" alt="Feed" />
    <p>Subscriptions</p>
    <img src="/img/subscribe.svg" alt="Subscriptions" />
    <p>Subscribe</p>
    <img src="/img/subscribe2.svg" alt="Subscribe" />
    <p>Search</p>
    <img src="/img/search.svg" alt="Search" />
    <p>Login</p>
    <img src="/img/login.svg" alt="feed" />
</div>
</body>
</html>
