openapi: 3.1.1
info:
  title: Podcast stream service
  version: 0.0.0
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas: {}
paths:
  /sessions:
    post:
      summary: log in
      tags:
        - sessions
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                login:
                  type: string
                password:
                  minLength: 1
                  type: string
              required:
                - login
                - password
        required: true
      responses:
        "201":
          description: Default Response
          headers:
            refresh_token:
              schema:
                type: string
              description: http-only cookie
          content:
            application/json:
              schema:
                type: object
                properties: {}
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: string
    delete:
      summary: log out
      tags:
        - sessions
      parameters:
        - schema:
            type: string
          in: header
          name: access_token
          required: true
          description: bearer token for authorization
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Default Response
  /sessions/access_token:
    post:
      summary: get access token
      tags:
        - sessions
      parameters:
        - schema:
            type: string
          in: header
          name: refresh_token
          required: true
          description: http-only cookie
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                required:
                  - accessToken
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                required:
                  - accessToken
  /:
    get:
      summary: home page
      tags:
        - static
      responses:
        "200":
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /api/podcasts/results:
    get:
      summary: search podcasts by query
      tags:
        - podcast
      parameters:
        - schema:
            type: string
          in: query
          name: query
          required: true
        - schema:
            minimum: 1
            type: integer
          in: query
          name: max_results
          required: true
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    title:
                      type: string
                    platform:
                      type: string
                    duration_s:
                      minimum: 1
                      type: integer
                    relevance:
                      type: string
                    url:
                      type: string
                  required:
                    - title
                    - platform
                    - duration_s
                    - relevance
                    - url
  /api/podcasts/result:
    get:
      summary: search podcast by url
      tags:
        - podcast
      parameters:
        - schema:
            type: string
          in: query
          name: url
          required: true
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                  platform:
                    type: string
                  duration_s:
                    minimum: 1
                    type: integer
                  relevance:
                    type: string
                  url:
                    type: string
                required:
                  - title
                  - platform
                  - duration_s
                  - relevance
                  - url
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Default Response
          content:
            application/json:
              schema:
                type: string
  /api/users/channels:
    get:
      summary: get array of user subscriptions
      tags:
        - user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      minimum: 1
                      type: integer
                    url:
                      type: string
                    title:
                      type: string
                    platform:
                      type: string
                  required:
                    - id
                    - url
                    - title
                    - platform
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: string
    post:
      summary: subscribe to channel
      tags:
        - users
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                channel_title:
                  type: string
                channel_url:
                  type: string
              required:
                - channel_title
                - channel_url
        required: true
      parameters:
        - schema:
            type: string
          in: header
          name: access_token
          required: true
          description: bearer token for authorization
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    minimum: 1
                    type: integer
                  url:
                    type: string
                  title:
                    type: string
                  platform:
                    type: string
                required:
                  - id
                  - url
                  - title
                  - platform
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: string
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: string
  /api/users/feed/content:
    get:
      summary: get feed content
      tags:
        - user
        - feed
      parameters:
        - schema:
            minimum: 1
            type: integer
          in: query
          name: feed_size
          required: false
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    title:
                      type: string
                    platform:
                      type: string
                    duration_s:
                      minimum: 1
                      type: integer
                    relevance:
                      type: string
                    url:
                      type: string
                  required:
                    - title
                    - platform
                    - duration_s
                    - relevance
                    - url
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: string
  /api/users/channels/{id}:
    delete:
      summary: unsubscribe from channel
      tags:
        - users
      parameters:
        - schema:
            minimum: 1
            type: integer
          in: path
          name: id
          required: true
        - schema:
            type: string
          in: header
          name: access_token
          required: true
          description: bearer token for authorization
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Default Response
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: string
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: string
    get:
      summary: get subscription by id
      tags:
        - users
      parameters:
        - schema:
            minimum: 1
            type: integer
          in: path
          name: id
          required: true
        - schema:
            type: string
          in: header
          name: access_token
          required: true
          description: bearer token for authorization
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    minimum: 1
                    type: integer
                  url:
                    type: string
                  title:
                    type: string
                  platform:
                    type: string
                required:
                  - id
                  - url
                  - title
                  - platform
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: string
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: string
    put:
      summary: update subscription information
      tags:
        - users
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                title:
                  type: string
                platform:
                  type: string
              required:
                - url
                - title
                - platform
        required: true
      parameters:
        - schema:
            minimum: 1
            type: integer
          in: path
          name: id
          required: true
        - schema:
            type: string
          in: header
          name: access_token
          required: true
          description: bearer token for authorization
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    minimum: 1
                    type: integer
                  url:
                    type: string
                  title:
                    type: string
                  platform:
                    type: string
                required:
                  - id
                  - url
                  - title
                  - platform
        "204":
          description: Default Response
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: string
    patch:
      summary: update subscription title
      tags:
        - users
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
              required:
                - title
        required: true
      parameters:
        - schema:
            minimum: 1
            type: integer
          in: path
          name: id
          required: true
        - schema:
            type: string
          in: header
          name: access_token
          required: true
          description: bearer token for authorization
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Default Response
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: string
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: string
  /api/streams:
    get:
      summary: get podcast audio
      tags:
        - stream
      parameters:
        - schema:
            type: string
          in: query
          name: url
          required: true
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            audio/mpeg:
              schema:
                description: audio response
                type: string
                format: binary
        "500":
          description: Default Response
          content:
            application/json:
              schema:
                type: string
